name: earchive

services:
  postgres:
    image: postgres:17
    container_name: earchive-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - earchive_data:/var/lib/postgresql/data

volumes:
  earchive_data: